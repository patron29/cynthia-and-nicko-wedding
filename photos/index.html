<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lb-close" aria-label="Close">&times;</button>
  <button class="lb-prev" id="lb-prev" aria-label="Previous photo">&#8249;</button>
  <img id="lb-img" src="" alt="">
  <button class="lb-next" id="lb-next" aria-label="Next photo">&#8250;</button>
  <p class="lb-count" id="lb-count"></p>
</div>
<script>
(function(){
  var thumbs=[].slice.call(document.querySelectorAll('.thumb'));
  var lb=document.getElementById('lightbox'), img=document.getElementById('lb-img'),
      count=document.getElementById('lb-count'), cur=0;
  function show(i){
    cur=(i+thumbs.length)%thumbs.length;
    img.src=thumbs[cur].getAttribute('data-full');
    count.textContent=cur+1+' of '+thumbs.length;
    lb.hidden=false; document.body.style.overflow='hidden';
  }
  function hide(){ lb.hidden=true; document.body.style.overflow=''; }
  thumbs.forEach(function(t,i){ t.addEventListener('click',function(){show(i);}); });
  document.getElementById('lb-close').addEventListener('click',hide);
  document.getElementById('lb-prev').addEventListener('click',function(){show(cur-1);});
  document.getElementById('lb-next').addEventListener('click',function(){show(cur+1);});
  lb.addEventListener('click',function(e){ if(e.target===lb) hide(); });
  document.addEventListener('keydown',function(e){
    if(lb.hidden) return;
    if(e.key==='Escape') hide();
    if(e.key==='ArrowLeft') show(cur-1);
    if(e.key==='ArrowRight') show(cur+1);
  });
})();
</script>
