<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cynthia Espinoza and Nicko Patron's Wedding Website - The Knot</title>
<link rel="stylesheet" href="../styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
</head>
<body class="rsvp-body">
<div class="rsvp-overlay">
  <div class="rsvp-topbar">
    <span class="rsvp-title">RSVP</span>
    <a class="rsvp-close" href="../" aria-label="Close">&times;</a>
  </div>
  <div class="rsvp-progress"><span></span></div>
  <div class="rsvp-content">
    <img class="spray rsvp-spray" src="../images/theme-top.png" alt="">
    <h1 class="rsvp-heading">Cynthia &amp; Nicko&rsquo;s Wedding</h1>
    <p>If you&rsquo;re responding for you and a guest (or your family), you&rsquo;ll be able to RSVP for your entire group.</p>
    <form id="rsvp-form">
      <div class="field">
        <input type="text" id="fullname" name="fullname" required autocomplete="name" placeholder=" ">
        <label for="fullname">Full Name</label>
      </div>
      <button type="submit" class="btn rsvp-btn" id="rsvp-submit" disabled>Find Your Invitation</button>
    </form>
    <p class="rsvp-note" id="rsvp-note" hidden><strong>Our wedding has already taken place, Friday, August 29, 2025.</strong><br>RSVPs closed May 31, 2025. Thank you to everyone who celebrated with us.</p>
  </div>
</div>
<script>
(function(){
  var input=document.getElementById('fullname'), btn=document.getElementById('rsvp-submit'),
      note=document.getElementById('rsvp-note');
  input.addEventListener('input',function(){ btn.disabled=!input.value.trim(); });
  document.getElementById('rsvp-form').addEventListener('submit',function(e){
    e.preventDefault();
    note.hidden=false;
    btn.disabled=true;
  });
})();
</script>
</body>
</html>
